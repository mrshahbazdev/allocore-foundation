      security: [{bearerAuth: []}]
      parameters:
        - name: X-Tenant
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                email: {type: string, format: email}
      responses:
