    delete:
      tags: [answers]
      summary: DELETE /api/v1/answers/{answer}
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: X-Tenant
          in: header
          required: true
          schema: {type: string}
      security: [{bearerAuth: []}]
      responses:
        '200': {description: OK}
        '401': {description: Unauthenticated}
        '403': {description: Forbidden — fehlende Permission oder falsches Tenant}
        '404': {description: Not Found}
        '422': {description: Validation failed}
