openapi: 3.0.3
info:
  title: ALLOCORE Foundation API
  version: 1.0.0
  description: |
    R3 API First — alle Module unter /api/v1, tenant-scoped via X-Tenant header.
    Auth: Sanctum Bearer Token (POST /api/v1/auth/token oder Dashboard-Token).
    Permissions: {domain}.view (GET), {domain}.manage (schreibend) pro Tenant-Rolle.
servers:
  - url: /
paths:
  /api/v1/answers/{answer}:
    delete:
      tags: [answers]
      summary: DELETE /api/v1/answers/{answer}
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: X-Tenant
          in: header
          required: true
          schema: {type: string}
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  name: {type: string}
                  email: {type: string, format: email}
                  roles: {type: array, items: {type: string}}
                  permissions: {type: array, items: {type: string}}
                  last_login_at: {type: string, format: date-time, nullable: true}
                  password_changed_at: {type: string, format: date-time, nullable: true}
                  email_verified: {type: boolean}
                  created_at: {type: string, format: date-time}
                  tenants:
                    type: array
                    description: eigene Mitgliedschaften mandantenübergreifend
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string, nullable: true}
                        roles: {type: array, items: {type: string}}
        '401': {description: Unauthenticated}
        '403': {description: Forbidden — fehlende Permission oder falsches Tenant}
        '404': {description: Not Found}
        '422': {description: Validation failed}
