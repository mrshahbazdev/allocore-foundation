openapi: 3.0.3
info:
  title: ALLOCORE Foundation API
  version: 1.0.0
  description: |
    R3 API First — alle Module unter /api/v1, tenant-scoped via X-Tenant header.
    Auth: Sanctum Bearer Token (POST /api/v1/auth/token oder Dashboard-Token).
    Permissions: {domain}.view (GET), {domain}.manage (schreibend) pro Tenant-Rolle.
servers:
  - url: /
